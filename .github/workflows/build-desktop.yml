name: Build ADE Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-app
    paths:
      - "desktop/**"
      - "public/**"
      - "config/**"
      - "scripts/**"
      - "server.mjs"
      - "package.json"
      - "electron-builder.yml"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate sources
        run: npm run check

      - name: Build Windows installer and portable app
        run: npm run dist:desktop

      - name: Upload thin desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ADE-Desktop-thin
          path: |
            dist-desktop/*.exe
            dist-desktop/*.yml
          if-no-files-found: error
          retention-days: 7
